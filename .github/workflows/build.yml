name: Build Container

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish Platform/Platform.Windows/Platform.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=false `
            -p:PublishReadyToRun=true `
            -o out

      - name: Rename
        shell: pwsh
        run: |
          if (Test-Path out/Container.exe) {
            Move-Item out/Container.exe out/container.exe
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: container-windows
          path: out/container.exe
          if-no-files-found: error

  
