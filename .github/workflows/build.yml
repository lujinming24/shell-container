name: Build Container

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: container-windows
          - os: macos-latest
            rid: osx-x64
            artifact: container-macos
          - os: ubuntu-latest
            rid: linux-x64
            artifact: container-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: bash
        run: |
          dotnet publish Container/Container.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o out

      - name: Rename artifact
        shell: bash
        run: |
          if [ -f out/Container.exe ]; then
            mv out/Container.exe out/container.exe
          elif [ -f out/Container ]; then
            mv out/Container out/container
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/container.exe
            out/container
          if-no-files-found: ignore
